</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div><div id="toasts"></div><button id="mus" class="b mus" onclick="toggleMusic()" aria-label="Toggle music">🎵</button>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,9);
const dayOf=s=>new Date(s+'T00:00').getDay();
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
let S={};try{S=JSON.parse(localStorage.getItem('catworld'))||{}}catch(e){}
S=Object.assign({habits:[],blocks:[],log:{},aw:{},own:{},eq:{},cs:0,nu:{},cheat:{},album:[],toySpots:{},cat:{coat:'dante',name:'Dante',chosen:0,disc:{}},xp:0,coins:0,focus:{},sessions:0,ach:[],md:{},set:{name:'',notif:false,sound:true,anim:true,goal:60,v:4,music:true,vol:{master:80,music:50,sfx:70,cat:70,ui:60},mute:{},trk:0,pal:'aqua'}},S);
S.album=Array.isArray(S.album)?S.album:[];S.toySpots=S.toySpots||{};

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;const tb=$('#toasts');while(tb.children.length>=3)tb.firstChild.remove();tb.appendChild(d);setTimeout(()=>d.remove(),4500)}
let AC,SIL;
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume()}catch(e){}}
function mew(t,f0,d,v,up){const o=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),m=AC.createGain(),lp=AC.createBiquadFilter();
o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*up,t+d*.3);o.frequency.linearRampToValueAtTime(f0*1.04,t+d);
lf.frequency.value=8;lg.gain.value=f0*.012;lf.connect(lg);lg.connect(o.frequency);
[[520,1000,680,3,1.1],[2700,2100,1800,4,.5]].forEach(([a,b,c,q,w])=>{const fl=AC.createBiquadFilter();fl.type='bandpass';fl.Q.value=q;fl.frequency.setValueAtTime(a,t);fl.frequency.linearRampToValueAtTime(b,t+d*.4);fl.frequency.linearRampToValueAtTime(c,t+d);const g2=AC.createGain();g2.gain.value=w;o.connect(fl);fl.connect(g2);g2.connect(m)});
m.gain.setValueAtTime(.001,t);m.gain.linearRampToValueAtTime(v*2.6,t+.045);m.gain.setValueAtTime(v*2.6,t+d*.6);m.gain.linearRampToValueAtTime(.001,t+d);
lp.type='lowpass';lp.frequency.value=4200;m.connect(lp);lp.connect(bus('cat'));o.start(t);lf.start(t);o.stop(t+d+.05);lf.stop(t+d+.05)}
let lastMw=0;
function meow(k){if(!S.set.sound)return toast('Sounds are off. Turn them on in Settings 🔈');const nw=Date.now();if(k!=='cheer'&&nw-lastMw<600)return;lastMw=nw;try{unlock();sil();lastM=Date.now();
const t=AC.currentTime+.03,r=.92+Math.random()*.16;
if(k==='sad')mew(t,640*r,.6,.3,1.18);else if(k==='cheer'){mew(t,880*r,.26,.3,1.45);mew(t+.31,980*r,.3,.3,1.45)}else mew(t,800*r,.36,.3,1.5)}catch(e){toast('This browser blocked the sound')}}
function beep(){sfx()}
let lastM=0,silT;
function sil(){try{SIL=SIL||new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAIARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');SIL.loop=true;if(SIL.paused)SIL.play().catch(()=>{});clearTimeout(silT);if(!MUS)silT=setTimeout(()=>SIL.pause(),5000)}catch(e){}}
function blip(k){if(!S.set.sound)return;try{unlock();sil();const q={tap:[[880,.04],[1175,.05]],nav:[[660,.04],[990,.06]],ok:[[784,.05],[988,.05],[1319,.1]],del:[[420,.06],[300,.09]],key:[[1500,.02]]}[k||'tap'];const t=AC.currentTime+.01,o=AC.createOscillator(),g=AC.createGain();o.type='square';let x=t;q.forEach(([f,d])=>{o.frequency.setValueAtTime(f,x);x+=d});g.gain.setValueAtTime(k==='key'?.06:.18,t);g.gain.linearRampToValueAtTime(.001,x);o.connect(g);g.connect(bus('ui'));o.start(t);o.stop(x+.02)}catch(e){}}

function bus(k){unlock();if(!BUS.m){BUS.m=AC.createGain();BUS.m.connect(AC.destination);['music','sfx','cat','ui'].forEach(n=>{BUS[n]=AC.createGain();BUS[n].connect(BUS.m)});applyVol()}return k==='m'?BUS.m:BUS[k]}
function applyVol(){if(!BUS.m)return;const v=S.set.vol,m=S.set.mute;BUS.m.gain.value=m.master?0:v.master/100;['music','sfx','cat','ui'].forEach(k=>BUS[k].gain.value=m[k]?0:v[k]/100)}
function setV(k,v){S.set.vol[k]=+v;save();const e=$('#v_'+k);if(e)e.textContent=v+'%';applyVol()}
function prevV(k){({cat:()=>meow('happy'),sfx:sfx,ui:()=>blip('ok'),master:()=>blip('ok')})[k]?.()}

const NOTE=n=>440*Math.pow(2,(n-69)/12),ARPP=[0,2,1,3,2,1,3,2],PENT=[0,2,4,7,9,12];

{n:'Cozy & relaxing',bpm:80,ch:C4,w:'square',vol:.05,hat:1,sd:1},
{n:'Cute & playful',bpm:112,ch:[[48,[64,67,72,76]],[53,[65,69,72,77]],[55,[67,71,74,79]],[48,[64,67,72,76]]],w:'square',vol:.045,hat:1,sd:2,ap:[0,1,2,3,2,1,2,3]},
{n:'Soft piano',bpm:66,ch:[[48,[60,64,67,72]],[43,[59,62,67,71]],[45,[57,60,64,69]],[41,[60,65,69,72]]],w:'triangle',vol:.13,dc:2.6,sd:3},
{n:'Rainy day',bpm:70,ch:CM,w:'triangle',vol:.09,dc:2,rain:1,sd:4},
{n:'Sleepy night',bpm:56,ch:C4,w:'sine',vol:.1,dc:3,pad:1,sd:5},

let MUSIC_NODES = [];

function trackMusicNode(node) {
  MUSIC_NODES.push(node);

  node.onended = () => {
    MUSIC_NODES = MUSIC_NODES.filter(n => n !== node);
  };

  return node;
}
function nt(type,f,t,d,v,lp){const o=trackMusicNode(AC.createOscillator()),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);let n=o;if(lp){const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;o.connect(l);n=l}n.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}

function chirp(t){const o=trackMusicNode(AC.createOscillator()),g=AC.createGain();o.frequency.setValueAtTime(2400,t);o.frequency.linearRampToValueAtTime(3400,t+.08);o.frequency.linearRampToValueAtTime(2600,t+.16);g.gain.setValueAtTime(.05,t);g.gain.linearRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.2)}
function mSched(){if(!AC||!MG)return;const tr=TRACKS[S.set.trk]||TRACKS[0],sd=60/tr.bpm/2;while(mT<AC.currentTime+.4){const i=mStep%32,k=i%8,[b,a]=tr.ch[i>>3],t=mT+(tr.swing&&k%2?sd*.25:0);
if(k===0||k===4)nt('triangle',NOTE(b),t,sd*3.5,.3);
if(tr.pad&&k===0)a.slice(0,3).forEach(n=>nt('sine',NOTE(n-12),t,sd*8,.05));
nt(tr.w,NOTE(a[(tr.ap||ARPP)[k]]),t,sd*(tr.dc||1.6),tr.vol,tr.w==='square'?2200:0);
if(!tr.pad&&((i*5+tr.sd)%7)<2)nt(tr.lead||'triangle',NOTE(72+PENT[(i*3+tr.sd)%6]),t,sd*2.4,.1);
if(tr.hat&&k%2)nz(t,7000,.05);if(tr.rain){nz(t+Math.random()*sd,5000,.05);nz(t+Math.random()*sd,4000,.04);nz(t+Math.random()*sd,6000,.05)}
if(tr.nature&&Math.random()<.12)chirp(t);mT+=sd;mStep++;if(mStep%64===0&&!S.set.rep)nextTrack(1,1)}}

function addH(e){e.preventDefault();const f=e.target;S.habits.push({id:uid(),name:f.n.value.trim(),desc:f.x.value.trim(),cat:f.c.value,freq:f.f.value,time:f.t.value,dur:+f.d.value||15});save();toast('New habit planted 🌱');render()}
function delH(id){if(confirm('Delete this habit?')){S.habits=S.habits.filter(h=>h.id!==id);save();render()}}
function addB(e){e.preventDefault();const f=e.target,s=mins(f.s.value),en=mins(f.e.value)||1440;if(s<300)return toast('Planner starts at 05:00 🌅');if(en<=s)return toast('End must be after start');
const ov=blocksFor(pday).some(b=>s<bEnd(b)&&mins(b.start)<en);if(ov&&!confirm('This overlaps another block. Add anyway?'))return;

function shift(n){const d=new Date(pday+'T00:00');d.setDate(d.getDate()+n);pday=ymd(d);render()}

setXp(){S.xp=Math.max(0,Math.round(+$('#a_x').value||0))},zeroXp(){S.xp=0},
recalc(){recalc();S.ach=[]},clean(){const n=sanitize();toast(`🧹 Removed ${n} invalid entries`)},
resetAch(){S.ach=[];S.md={}},resetShop(){S.own={};S.eq={};S.nu={};S.cheat={}},
refundShop(){S.coins+=ITEMS.filter(i=>S.own[i[0]]&&!S.cheat[i[0]]).reduce((a,i)=>a+i[4],0);S.own={};S.eq={};S.nu={};S.cheat={}},
unlockAll(){ITEMS.forEach(i=>{if(!S.own[i[0]]){S.own[i[0]]=1;S.cheat[i[0]]=1}})},
undoUnlock(){Object.keys(S.cheat).forEach(id=>{delete S.own[id];unEq(id)});S.cheat={}},
resetLayout(){S.layout={};S.toySpots={}},clearAlbum(){S.album=[]},resetCat(){S.cat={coat:'dante',name:'Dante',chosen:0,disc:{}};S.cs=0},calm(){CAT.stim=0;CAT.coolUntil=0;CAT.q=[];to('idle',500)},
clearToday(){const d=ymd();delete S.log[d];Object.keys(S.aw).filter(k=>k.startsWith(d)).forEach(k=>delete S.aw[k])},
clearHistory(){if(confirm('Clear ALL habit history?')){S.log={};S.aw={};S.md={};S.focus={};S.sessions=0}},
export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='cat-world-backup.json';a.click()},
import(){try{const o=JSON.parse($('#a_i').value);if(typeof o!=='object'||!o.habits)throw 0;S=Object.assign(S,o);toast('Imported ✓')}catch(e){toast('That JSON is not valid')}},
fullReset(){if(confirm('Delete EVERYTHING and start from zero?')&&confirm('Really? This cannot be undone.')){try{localStorage.removeItem('catworld')}catch(e){}location.reload()}}};
const unEq=id=>{const i=ITEM[id];if(i[1]==='toy')delete S.eq['t:'+id];else if(S.eq[i[2]]===id)delete S.eq[i[2]]};
function admItem(id,b){if(S.own[id]){delete S.own[id];delete S.cheat[id];unEq(id)}else{S.own[id]=1;S.cheat[id]=1}save();render();b.className='b '+(S.own[id]?'':'g');b.textContent=(S.own[id]?'✓ ':'')+ITEM[id][3]}
function adm(k){if(['resetShop','refundShop','resetCat','recalc','resetAch','undoUnlock'].includes(k)&&!confirm('Are you sure?'))return;ADM[k]();save();pal(S.cat.coat);applyPal();const c=$('#ac'),x=$('#ax');if(c)c.textContent=S.coins;if(x)x.textContent=S.xp+' (Lv '+lvl()+')';render();
if(['resetShop','refundShop','unlockAll','undoUnlock'].includes(k)&&$('#adm')){const sc=$('#adm .card').scrollTop;$('#adm').remove();openAdmin();$('#adm .card').scrollTop=sc}if(k!=='fullReset')toast('Done ✓')}
function openAdmin(){if($('#adm'))return;const el=document.createElement('div');el.id='adm';el.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(40,30,50,.55);display:flex;align-items:center;justify-content:center;padding:14px';
const B=(k,l,c)=>`<button class="b ${c||'g'}" style="margin:0 6px 8px 0" onclick="adm('${k}')">${l}</button>`;
el.innerHTML=`<div class="card" style="max-width:540px;width:100%;max-height:88vh;overflow:auto;margin:0"><h3>🛠️ Developer panel</h3><p>🪙 <b id="ac">${S.coins}</b> · XP <b id="ax">${S.xp} (Lv ${lvl()})</b></p>
<label>Coins</label><div style="display:flex;gap:8px;margin-bottom:8px"><input id="a_c" type="number" value="${S.coins}">${B('setCoins','Set','')}</div>${B('addCoins','+100')}${B('zeroCoins','Coins → 0')}
<label>XP</label><div style="display:flex;gap:8px;margin-bottom:8px"><input id="a_x" type="number" value="${S.xp}">${B('setXp','Set','')}</div>${B('zeroXp','XP → 0')}
<h3 style="margin-top:12px">Repair</h3>${B('clean','Clean fake entries','p')}${B('recalc','Recalculate coins & XP from real history','p')}${B('calm','Calm the cat')}
<h3 style="margin-top:12px">Reset</h3>${B('clearToday','Clear today')}${B('resetAch','Reset achievements')}${B('resetCat','Reset cat')}${B('resetLayout','Reset room layout')}${B('clearAlbum','Clear album')}${B('clearHistory','Clear habit history')}
<h3 style="margin-top:12px">Items</h3><p><small>Cheat-unlocked items are tracked separately, so you can undo them without losing what you really bought.</small></p>${B('unlockAll','Unlock all items')}${B('undoUnlock','Undo cheat unlocks','p')}${B('refundShop','Reset shop & refund coins')}${B('resetShop','Reset shop (no refund)')}
<p style="margin:8px 0 4px"><small>Tap one item to give or remove it:</small></p><div>${ITEMS.map(i=>`<button class="b ${S.own[i[0]]?'':'g'}" style="margin:0 5px 7px 0;padding:6px 10px;font-size:12px" onclick="admItem('${i[0]}',this)">${S.own[i[0]]?'✓ ':''}${i[3]}</button>`).join('')}</div>
<h3 style="margin-top:12px">Data</h3>${B('export','Export JSON','l')}<textarea id="a_i" rows="3" placeholder="Paste exported JSON here" style="margin:8px 0"></textarea>${B('import','Import JSON','l')}${B('fullReset','⚠️ Full reset')}
<p><button class="b" onclick="$('#adm').remove()">Close</button></p></div>`;document.body.appendChild(el)}

pal(S.cat.coat);applyPal();if(S.cs){CAT.st='sleeping';CAT.until=Date.now()+rnd(60000,120000)}

{const bad=sanitize();if(bad){recalc();S.ach=[];save();setTimeout(()=>toast(`🧹 Cleaned ${bad} fake entries and recalculated your coins & XP`),900)}}
check(1);render();{const b=$('#mus');if(b)b.textContent=S.set.music?'🎵':'🔇'}
</script></body></html>
